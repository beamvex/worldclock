[package]
name = "worldclock"
version = "1.0.0"
description = "A Tauri World Clock App"
authors = [""]
edition = "2021"

[lib]
name = "worldclock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
